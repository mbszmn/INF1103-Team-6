[project]
name = "inf1103-team6-helpdesk"
version = "2.0.0"
description = "AI SIT Helpdesk Ticket Triage System, INF1103 Team 6"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["test_scripts"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["."]
omit = ["test_scripts/*"]
# also measure main.py when a test starts it as its own process
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E7", "E9", "F", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
# app code only, some tests pass wrong types on purpose to check the validation
exclude = ["^test_scripts/"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
