name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
        id: install
      - name: Ruff
        run: ruff check --output-format=github .
      # still runs when ruff fails, so one run shows every problem (the job still fails)
      - name: Mypy
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run every test file with coverage
        run: >
          python -m pytest
          --junitxml=test-results/junit.xml
          --cov --cov-report=term-missing
          --cov-report=xml:test-results/coverage.xml
          --cov-report=html:test-results/htmlcov
      - name: Write the test summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("test-results/junit.xml")
          if not report.exists():
              print("No test report was made.")
              raise SystemExit
          counts = {}
          for case in ET.parse(report).iter("testcase"):
              parts = (case.get("classname") or case.get("name") or "").split(".")
              file = next((p for p in parts if p.startswith("test_") and p != "test_scripts"), "collection")
              failed = case.find("failure") is not None or case.find("error") is not None
              skipped = case.find("skipped") is not None
              row = counts.setdefault(file, [0, 0, 0])
              row[1 if failed else 2 if skipped else 0] += 1
          print("### Tests by file")
          print("| Test file | Passed | Failed | Skipped |")
          print("|---|---|---|---|")
          for file, (passed, failed, skipped) in sorted(counts.items()):
              print(f"| {file} | {passed} | {failed} | {skipped} |")
          EOF
          if [ -f .coverage ]; then
            echo "### Coverage" >> "$GITHUB_STEP_SUMMARY"
            python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/

  docker:
    name: Docker build, tests in container, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the test image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: test
          load: true
          tags: helpdesk-tests:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run every test file inside the container
        run: docker run --rm helpdesk-tests:ci
      # the app image and smoke test still run when a test fails, so the run shows both results
      - name: Build the app image
        id: app_image
        if: ${{ !cancelled() }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          load: true
          tags: helpdesk:ci
          cache-from: type=gha
      - name: Smoke test, save a ticket with no API key, then exit
        if: ${{ !cancelled() && steps.app_image.outcome == 'success' }}
        run: |
          answers='1\nAlex\n2600001\nDell Latitude 5430\nWiFi problem\nCannot connect to the school WiFi\n\n\nHigh\n7\n'
          output=$(printf "$answers" | docker run -i --rm helpdesk:ci 2>&1)
          echo "$output"
          echo "$output" | grep -q "AI SIT HELPDESK TICKET TRIAGE SYSTEM"
          echo "$output" | grep -q "successfully processed and saved"
          echo "$output" | grep -q "Thank you for using"
          if echo "$output" | grep -qE "Could not (save|open|write)"; then
            echo "The app could not save tickets or open its log file inside the image"
            exit 1
          fi

  publish:
    name: Publish image to GHCR
    needs: [lint, test, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ steps.image.outputs.page }}
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - name: Work out the image name and app version
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "page=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/pkgs/container/${name##*/}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=main-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.image.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    name: Verify the published image
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the exact image that was pushed and smoke test it
        run: |
          image="${{ needs.publish.outputs.image }}@${{ needs.publish.outputs.digest }}"
          docker pull "$image"
          answers='1\nAlex\n2600001\nDell Latitude 5430\nWiFi problem\nCannot connect to the school WiFi\n\n\nHigh\n7\n'
          output=$(printf "$answers" | docker run -i --rm "$image" 2>&1)
          echo "$output"
          echo "$output" | grep -q "AI SIT HELPDESK TICKET TRIAGE SYSTEM"
          echo "$output" | grep -q "successfully processed and saved"
          echo "$output" | grep -q "Thank you for using"
          if echo "$output" | grep -qE "Could not (save|open|write)"; then
            echo "The app could not save tickets or open its log file inside the image"
            exit 1
          fi

  release:
    name: GitHub release
    needs: [publish, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: test-results-py3.13
          path: test-results
      - name: Create the release with the test and coverage reports
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.publish.outputs.image }}
        run: |
          (cd test-results && zip -qr ../test-and-coverage-report.zip .)
          version="${GITHUB_REF_NAME#v}"
          notes="Run this release with Docker:
          docker run -it --rm --env-file .env -v helpdesk-data:/app/data $IMAGE:$version"
          gh release create "$GITHUB_REF_NAME" test-and-coverage-report.zip \
            --title "Helpdesk $GITHUB_REF_NAME" --generate-notes --notes "$notes" --verify-tag
